plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

def customBuildDir = findProperty('appBuildDir')
if (customBuildDir) {
    buildDir = file(customBuildDir)
}

android {
    namespace 'com.magicgrid'
    compileSdk 34

    defaultConfig {
        applicationId "com.magicgrid"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    buildFeatures {
        aidl false
        renderScript false
        resValues false
        shaders false
    }
    lint {
        // Keep legacy theme assets and pinned deps for AGP 7.4 compatibility.
        disable 'UnusedResources', 'GradleDependency', 'OldTargetApi', 'PluralsCandidate'
    }
}

dependencies {
    // AndroidX
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.gms:play-services-ads:23.1.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
